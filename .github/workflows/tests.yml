name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pytest
      - name: Python tests (no data and no torch needed; the one test that needs torch is skipped)
        run: python -m pytest -q -p no:cacheprovider tests
      - name: MANIFEST.txt matches the files
        run: sha256sum --check --quiet MANIFEST.txt
